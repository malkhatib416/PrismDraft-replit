kind = "web"
previewPath = "/"
title = "PrismDraft"
description = "A content workspace for content and SEO teams to brief, outline, generate, review, approve, and publish structured articles with auditable usage and permissions."
version = "1.0.0"
id = "artifacts/prismdraft"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24268

[services.development]
run = "pnpm --filter @workspace/prismdraft run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prismdraft", "run", "build" ]
serve = "static"
publicDir = "artifacts/prismdraft/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24268"
BASE_PATH = "/"
